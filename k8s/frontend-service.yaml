apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: repotriage
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: repotriage
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
