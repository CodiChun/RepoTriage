apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: repotriage
  namespace: repotriage
  labels:
    app.kubernetes.io/name: repotriage
    app.kubernetes.io/part-of: repotriage
  annotations:
    # Uncomment and adjust for your ingress controller.
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
  # tls:
  #   - hosts:
  #       - app.example.com
  #       - api.example.com
  #     secretName: repotriage-tls
