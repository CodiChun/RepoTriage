apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: repotriage
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: repotriage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: repotriage
    spec:
      containers:
        - name: backend
          image: docker.io/codichun/repotriage-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: repotriage-secrets
                  key: DATABASE_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: repotriage-secrets
                  key: GITHUB_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: repotriage-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: repotriage-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GITHUB_REPO
              valueFrom:
                configMapKeyRef:
                  name: repotriage-config
                  key: GITHUB_REPO
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: repotriage-config
                  key: LLM_PROVIDER
            - name: EMBEDDING_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: repotriage-config
                  key: EMBEDDING_PROVIDER
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: repotriage-config
                  key: CORS_ORIGINS
          volumeMounts:
            - name: chroma-data
              mountPath: /app/chroma_db
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: backend-chroma-data
