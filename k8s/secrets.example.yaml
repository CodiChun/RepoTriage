# Template only — do NOT commit real credentials.
# GitHub Actions creates `repotriage-secrets` automatically during deploy.
#
# kubectl create secret generic repotriage-secrets \
#   --namespace repotriage \
#   --from-literal=POSTGRES_USER=repotriage \
#   --from-literal=POSTGRES_PASSWORD=change-me \
#   --from-literal=POSTGRES_DB=repotriage \
#   --from-literal=DATABASE_URL=postgresql://repotriage:change-me@postgres:5432/repotriage \
#   --from-literal=GITHUB_TOKEN=ghp_xxx \
#   --from-literal=ANTHROPIC_API_KEY=sk-ant-xxx \
#   --from-literal=OPENAI_API_KEY=sk-xxx
apiVersion: v1
kind: Secret
metadata:
  name: repotriage-secrets
  namespace: repotriage
type: Opaque
stringData:
  POSTGRES_USER: repotriage
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: repotriage
  DATABASE_URL: postgresql://repotriage:change-me@postgres:5432/repotriage
  GITHUB_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
