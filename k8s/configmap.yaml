apiVersion: v1
kind: ConfigMap
metadata:
  name: repotriage-config
  namespace: repotriage
  labels:
    app.kubernetes.io/name: repotriage
data:
  GITHUB_REPO: "owner/repo_name"
  LLM_PROVIDER: ""
  EMBEDDING_PROVIDER: "fastembed"
  # Comma-separated origins allowed by the backend CORS middleware.
  # Set via deploy workflow from FRONTEND_URL secret.
  CORS_ORIGINS: "https://app.example.com"
