apiVersion: v1
kind: ConfigMap
metadata:
  name: repotriage-config
  namespace: repotriage
  labels:
    app.kubernetes.io/name: repotriage
data:
  GITHUB_REPO: "CodiChun/RepoTriage"
  LLM_PROVIDER: ""
  EMBEDDING_PROVIDER: "fastembed"
  # Allow all origins until a domain is configured; tighten after you have a stable URL.
  CORS_ORIGINS: "*"
