apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: repotriage

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - backend-pvc.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

images:
  - name: docker.io/codichun/repotriage/backend
    newName: docker.io/codichun/repotriage/backend
    newTag: latest
  - name: docker.io/codichun/repotriage/frontend
    newName: docker.io/codichun/repotriage/frontend
    newTag: latest
