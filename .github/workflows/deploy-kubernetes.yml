name: Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kubernetes-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  K8S_NAMESPACE: repotriage
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile
            context: .
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: .
            build_args: NEXT_PUBLIC_API_URL=

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-${{ matrix.image }}:latest
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to cluster
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Check GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::error::GCP_SA_KEY is missing. A laptop GKE kubeconfig uses gke-gcloud-auth-plugin, which GitHub-hosted runners do not have."
            echo "Create a GCP service account with roles/container.developer, download the JSON key, and store it as secret GCP_SA_KEY (also on the production environment if that environment has its own secrets)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Resolve GKE cluster
        id: gke
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
          GKE_CLUSTER: ${{ vars.GKE_CLUSTER || secrets.GKE_CLUSTER }}
          GKE_LOCATION: ${{ vars.GKE_LOCATION || secrets.GKE_LOCATION }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT || secrets.GCP_PROJECT }}
        run: |
          set -euo pipefail

          CLUSTER="${GKE_CLUSTER:-}"
          LOCATION="${GKE_LOCATION:-}"
          PROJECT="${GCP_PROJECT:-}"

          if [ -z "${CLUSTER}" ] || [ -z "${LOCATION}" ]; then
            if [ -z "${KUBE_CONFIG_DATA}" ]; then
              echo "::error::Set GKE_CLUSTER and GKE_LOCATION (Actions variables), or provide KUBE_CONFIG whose current-context is gke_PROJECT_LOCATION_CLUSTER."
              exit 1
            fi

            export KUBECONFIG="${RUNNER_TEMP}/kubeconfig-src"
            if printf '%s' "${KUBE_CONFIG_DATA}" | grep -q 'apiVersion:'; then
              printf '%s\n' "${KUBE_CONFIG_DATA}" > "${KUBECONFIG}"
            else
              printf '%s' "${KUBE_CONFIG_DATA}" | tr -d '[:space:]' | base64 --decode > "${KUBECONFIG}"
            fi
            chmod 600 "${KUBECONFIG}"

            CONTEXT="$(kubectl config current-context 2>/dev/null || true)"
            if [ -z "${CONTEXT}" ]; then
              CONTEXT="$(kubectl config get-contexts -o name 2>/dev/null | head -n1 || true)"
            fi
            echo "Discovered context: ${CONTEXT}"

            if [[ "${CONTEXT}" =~ ^gke_([^_]+)_([^_]+)_(.+)$ ]]; then
              PROJECT="${PROJECT:-${BASH_REMATCH[1]}}"
              LOCATION="${LOCATION:-${BASH_REMATCH[2]}}"
              CLUSTER="${CLUSTER:-${BASH_REMATCH[3]}}"
            else
              echo "::error::Could not parse GKE cluster from context '${CONTEXT}'. Set GKE_CLUSTER and GKE_LOCATION."
              exit 1
            fi
          fi

          echo "cluster=${CLUSTER}" >> "${GITHUB_OUTPUT}"
          echo "location=${LOCATION}" >> "${GITHUB_OUTPUT}"
          echo "project=${PROJECT}" >> "${GITHUB_OUTPUT}"
          echo "Using cluster=${CLUSTER} location=${LOCATION} project=${PROJECT}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ steps.gke.outputs.cluster }}
          location: ${{ steps.gke.outputs.location }}
          project_id: ${{ steps.gke.outputs.project }}

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Create or update application secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'repotriage' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'repotriage' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'repotriage' }}
          APP_GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          kubectl create namespace "${{ env.K8S_NAMESPACE }}" --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "${POSTGRES_PASSWORD}" ]; then
            echo "::error::POSTGRES_PASSWORD is empty. The postgres image will not initialize without a superuser password. Set secret POSTGRES_PASSWORD (or rely on the repotriage default)."
            exit 1
          fi

          DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

          kubectl create secret generic repotriage-secrets \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --from-literal=POSTGRES_USER="${POSTGRES_USER}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=POSTGRES_DB="${POSTGRES_DB}" \
            --from-literal=GITHUB_TOKEN="${APP_GITHUB_TOKEN}" \
            --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Patch runtime config
        env:
          GITHUB_REPO: ${{ vars.GITHUB_REPO || secrets.GITHUB_REPO || 'CodiChun/RepoTriage' }}
        run: |
          kubectl create configmap repotriage-config \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --from-literal=GITHUB_REPO="${GITHUB_REPO}" \
            --from-literal=LLM_PROVIDER="" \
            --from-literal=EMBEDDING_PROVIDER="fastembed" \
            --from-literal=CORS_ORIGINS="*" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifests with image tags
        run: |
          cd k8s
          kustomize edit set image \
            docker.io/codichun/repotriage-backend=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-backend:${{ env.IMAGE_TAG }} \
            docker.io/codichun/repotriage-frontend=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-frontend:${{ env.IMAGE_TAG }}

      - name: Apply manifests
        run: kubectl apply -k k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres -n "${{ env.K8S_NAMESPACE }}" --timeout=300s
          kubectl rollout status deployment/backend -n "${{ env.K8S_NAMESPACE }}" --timeout=300s
          kubectl rollout status deployment/frontend -n "${{ env.K8S_NAMESPACE }}" --timeout=300s

      - name: Show deployment status
        if: always()
        run: |
          kubectl get pods,svc -n "${{ env.K8S_NAMESPACE }}"
          echo "---- postgres logs ----"
          kubectl logs -n "${{ env.K8S_NAMESPACE }}" -l app.kubernetes.io/name=postgres --tail=80 || true
          echo "---- backend logs ----"
          kubectl logs -n "${{ env.K8S_NAMESPACE }}" -l app.kubernetes.io/name=backend --tail=80 || true
          echo "Frontend external IP (may take a minute to assign):"
          kubectl get svc frontend -n "${{ env.K8S_NAMESPACE }}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}{"\n"}'
