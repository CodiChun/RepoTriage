name: Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kubernetes-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  K8S_NAMESPACE: repotriage
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile
            context: .
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: .
            build_args: NEXT_PUBLIC_API_URL=

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-${{ matrix.image }}:latest
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to cluster
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${KUBECONFIG}" >> "${GITHUB_ENV}"

          if [ -z "${KUBE_CONFIG_DATA}" ]; then
            echo "::error::KUBE_CONFIG is missing or empty. kubectl then defaults to http://localhost:8080 and GitHub-hosted runners have no cluster there."
            echo "Add a repository secret named KUBE_CONFIG (Settings → Secrets and variables → Actions)."
            echo "This job also uses the production environment, so if that environment has its own secrets, add KUBE_CONFIG there too."
            echo "Store a Secret, not a Variable. Encode with: base64 < ~/.kube/config | pbcopy"
            exit 1
          fi

          if printf '%s' "${KUBE_CONFIG_DATA}" | grep -q 'apiVersion:'; then
            printf '%s\n' "${KUBE_CONFIG_DATA}" > "${KUBECONFIG}"
          else
            printf '%s' "${KUBE_CONFIG_DATA}" | tr -d '[:space:]' | base64 --decode > "${KUBECONFIG}"
          fi
          chmod 600 "${KUBECONFIG}"

          if ! kubectl config current-context >/dev/null 2>&1; then
            FIRST_CONTEXT="$(kubectl config get-contexts -o name 2>/dev/null | head -n1 || true)"
            if [ -n "${FIRST_CONTEXT}" ]; then
              kubectl config use-context "${FIRST_CONTEXT}"
            fi
          fi

          if ! CTX_ERR="$(kubectl config current-context 2>&1)"; then
            echo "::error::KUBE_CONFIG did not decode into a valid kubeconfig with a current-context."
            echo "${CTX_ERR}"
            echo "bytes=$(wc -c < "${KUBECONFIG}")"
            kubectl config get-contexts 2>&1 || true
            exit 1
          fi

          SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          echo "Context: $(kubectl config current-context)"
          echo "API server: ${SERVER}"

          case "${SERVER}" in
            *localhost*|*127.0.0.1*|*'[::1]'*)
              echo "::error::kubeconfig points at ${SERVER}. GitHub-hosted runners cannot reach a local cluster. Use your GKE API endpoint."
              exit 1
              ;;
          esac

          if ! kubectl cluster-info; then
            echo "::error::Cannot reach the cluster. A local GKE kubeconfig usually needs gke-gcloud-auth-plugin, which is not installed on GitHub-hosted runners."
            echo "Use a CI-ready kubeconfig (service-account token) or google-github-actions/get-gke-credentials with a GCP service account."
            exit 1
          fi

      - name: Create or update application secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'repotriage' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'repotriage' }}
          APP_GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          kubectl create namespace "${{ env.K8S_NAMESPACE }}" --dry-run=client -o yaml | kubectl apply -f -

          DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

          kubectl create secret generic repotriage-secrets \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --from-literal=POSTGRES_USER="${POSTGRES_USER}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=POSTGRES_DB="${POSTGRES_DB}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=GITHUB_TOKEN="${APP_GITHUB_TOKEN}" \
            --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Patch runtime config
        env:
          GITHUB_REPO: ${{ vars.GITHUB_REPO || secrets.GITHUB_REPO || 'CodiChun/RepoTriage' }}
        run: |
          kubectl create configmap repotriage-config \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --from-literal=GITHUB_REPO="${GITHUB_REPO}" \
            --from-literal=LLM_PROVIDER="" \
            --from-literal=EMBEDDING_PROVIDER="fastembed" \
            --from-literal=CORS_ORIGINS="*" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifests with image tags
        run: |
          cd k8s
          kustomize edit set image \
            docker.io/codichun/repotriage-backend=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-backend:${{ env.IMAGE_TAG }} \
            docker.io/codichun/repotriage-frontend=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/repotriage-frontend:${{ env.IMAGE_TAG }}

      - name: Apply manifests
        run: kubectl apply -k k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres -n "${{ env.K8S_NAMESPACE }}" --timeout=300s
          kubectl rollout status deployment/backend -n "${{ env.K8S_NAMESPACE }}" --timeout=300s
          kubectl rollout status deployment/frontend -n "${{ env.K8S_NAMESPACE }}" --timeout=300s

      - name: Show deployment status
        if: always()
        run: |
          kubectl get pods,svc -n "${{ env.K8S_NAMESPACE }}"
          echo "Frontend external IP (may take a minute to assign):"
          kubectl get svc frontend -n "${{ env.K8S_NAMESPACE }}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}{"\n"}'
